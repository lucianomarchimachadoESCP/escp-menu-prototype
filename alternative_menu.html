<style>

  :root{
    --brand:#230083;
    --table-head:#D9E1F2;
    --text:#230083;
    --muted:#555;
    --border:#230083;
  }

  body{
    margin:0;
    background:#fff;
    color:var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* PAGE CONTAINER */
  .page{
    width:100%;
    max-width:700px;
    margin:0 auto;
    padding:18px;
    box-sizing:border-box;
  }

  /* LANGUAGE BAR */
  .language-bar {
    display:flex;
    justify-content:center;
    gap:10px;
    padding:10px;
    background:#f5f7fa;
    border-bottom:1px solid #dfe3eb;
    flex-wrap:wrap;
  }

  .language-bar img {
    width:26px;
    height:18px;
    border-radius:3px;
    box-shadow:0 0 2px rgba(0,0,0,0.2);
  }

  /* HEADER */
  .header{
    background:var(--brand);
    color:#fff;
    padding:18px;
    border-radius:10px;

    display:flex;
    align-items:center;
    gap:18px;
  }

  .header-image{
    width:80px;
    height:auto;
    border-radius:6px;
  }

  .header-text{
    display:flex;
    flex-direction:column;
  }

  .header .title{
    margin:0;
    font-size:22pt;
    font-weight:700;
  }

  .header .subtitle{
    margin:4px 0 0;
    font-size:12pt;
  }

  /* WEEK & DAYS */
  .week{
    font-size:15pt;
    margin:24px 0 10px;
    font-weight:600;
  }

  .day{
    font-size:20pt;
    font-weight:800;
    margin:28px 0 8px;
    color:var(--brand);
  }

  /* TABLES */
  table{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    border-collapse:separate;
    overflow:hidden;
    margin:12px 0 22px;
    font-size:13pt;

    display:block;     
    overflow-x:auto;   /* enables scrolling when needed */
  }

  thead th{
    background:var(--table-head);
    padding:10px 12px;
    font-weight:700;
    text-align:left;
    min-width:130px;
  }

  tbody td{
    padding:10px 12px;
    border-bottom:1px solid #e7eaf2;
    vertical-align:top;
    min-width:130px;
  }

  tbody tr:last-child td{
    border-bottom:none;
  }

  .dish{
    font-weight:600;
    font-size:13pt;
  }

  .diet{
    font-size:11.5pt;
    color:var(--muted);
    white-space:nowrap;
  }

  .allergen-row td{
    color:#777;
    font-size:11.5pt;
  }

  /* LEGEND */
  .legend{
    margin-top:30px;
    padding-top:16px;
    border-top:1px dashed #cfd6e4;
    color:var(--muted);
    font-size:11.5pt;
    line-height:1.5;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .logo img{
    height:22px;
  }

  .logo span{
    font-size:15pt;
    font-weight:700;
  }

  /* ----------------------------------------------
     ⚠️ MOBILE OPTIMIZED STYLES (iPhone 14 & below)
     ---------------------------------------------- */
  @media (max-width: 430px){

    .page{
      padding:12px;
    }

    /* header more compact */
    .header{
      flex-direction:column;
      text-align:center;
      padding:14px;
      gap:12px;
    }

    .header-image{
      width:70px;
    }

    .header .title{
      font-size:17pt;
    }

    .header .subtitle{
      font-size:10pt;
    }

    .week{
      font-size:13pt;
      margin:18px 0 6px;
    }

    .day{
      font-size:16pt;
      margin:22px 0 6px;
    }

    /* TABLE COMPACT MODE */
    table{
      font-size:10pt;
      margin:10px 0 16px;
      border-radius:8px;
    }

    thead th{
      padding:6px 8px;
      min-width:90px;   /* critical for iPhone fit */
      font-size:10pt;
    }

    tbody td{
      padding:6px 8px;
      min-width:90px;
      font-size:10pt;
    }

    .dish{
      font-size:10pt;
    }

    .diet{
      font-size:9pt;
    }

    .allergen-row td{
      font-size:9pt;
    }

    .legend{
      font-size:9.5pt;
      margin-top:20px;
    }

    .language-bar img{
      width:22px;
      height:15px;
    }
  }

</style>
